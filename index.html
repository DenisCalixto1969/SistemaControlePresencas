<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema Gestão Capitulo</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     
    <section id="tela-login" class="tela-login">
    <div class="login-caixa">
        <h2>Controle de Presenças</h2>

        <p>
            Informe seu e-mail e senha para acessar o sistema.
        </p>

        <form id="formulario-login">
            <div class="grupo-campo">
                <label for="login-email">E-mail</label>

                <input
                    type="email"
                    id="login-email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="grupo-campo">
                <label for="login-senha">Senha</label>

                <input
                    type="password"
                    id="login-senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <p
                id="mensagem-login"
                class="mensagem-login"
            ></p>

            <button
                type="submit"
                class="botao-primario"
            >
                Entrar
            </button>
        </form>
    </div>
</section>


    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <h1>Subl.'. Cap.'. CCav.'. Rosa Cruz "Alfredo Gabriel"</h1>
            <p>Controle de Membros, Sessões e frequência.</p>
        </div>
    </header>

   <nav class="menu-principal">
    <button
        type="button"
        class="menu-botao ativo"
        data-modulo="inicio"
    >
        Início
    </button>

    <button
        type="button"
        class="menu-botao"
        data-modulo="membros"
    >
        Membros
    </button>

    <button
        type="button"
        class="menu-botao"
        data-modulo="sessoes"
    >
        Sessões
    </button>

    <button
        type="button"
        class="menu-botao"
        data-modulo="presencas"
    >
        Presenças
    </button>

    <button
        type="button"
        class="menu-botao"
        data-modulo="relatorios"
    >
        Relatórios
    </button>

    <button
        type="button"
        class="menu-botao"
        data-modulo="ranking"
    >
        Ranking
    </button>
</nav>

   <main
    class="conteudo-principal"
    id="conteudo-principal"
>

</main>
<section
    id="modulo-sessao-aberta"
    style="display:none;"
>
</section>

    <footer class="rodape">
        <p>
          Sub.'. Cap.'. CCav.'. Rosa Cruz "Alfredo Gabriel" - Guaraçai/SP
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/entidades.js"></script>
    <script src="js/database.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/membros.js"></script>
    <script src="js/SessaoAberta.js"></script>
    <script src="js/sessoes.js"></script>
    <script src="js/presencas.js"></script>
    <script src="js/relatorios.js"></script>
    <script src="js/ranking.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>

</body>
</html>

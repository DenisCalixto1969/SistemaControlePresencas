name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Consultar tabela técnica do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          URL="${SUPABASE_URL%/}/rest/v1/keepalive_ping?select=id"

          RESPOSTA=$(curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 \
            "$URL" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")

          echo "Consulta realizada com sucesso."
          echo "Resposta: $RESPOSTA"
